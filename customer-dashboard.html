<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Dashboard</title><style>body{margin:0;font-family:Inter,system-ui;background:#f7faf8;color:#10221b}.wrap{width:min(1050px,92%);margin:30px auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:15px}.card{background:#fff;border:1px solid #e4ebe7;border-radius:18px;padding:20px;margin:16px 0}.btn{padding:11px 15px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#16845a;color:#fff}.muted{color:#66756f}.row{display:flex;justify-content:space-between;gap:15px;border-top:1px solid #e4ebe7;padding:15px 0}.row:first-child{border-top:0}</style></head><body><div class="wrap"><div class="bar"><div><h1>Customer Dashboard</h1><p id="welcome" class="muted"></p></div><div><a class="btn primary" href="index.html">Find Services</a> <a class="btn" href="notifications.html">Notifications</a> <a class="btn" href="messages.html">Messages</a> <button class="btn" onclick="logout()">Logout</button></div></div><div class="card"><h2>My Requests</h2><div id="requests">Loading...</div></div><div class="card"><h2>My Bookings</h2><div id="bookings">Loading...</div></div></div><script src="dashboard.js"></script><script>function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;',"\"":'&quot;'}[c]))}async function load(){try{let d=await api('/customer/dashboard');welcome.textContent='Welcome, '+d.user.name;requests.innerHTML=d.requests.length?d.requests.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.category||'Service')} · ${esc(x.status)} · ${x.quote_count||0} quote${Number(x.quote_count||0)===1?'':'s'}</div></div><div style="text-align:right"><span>${esc(x.city||'')}</span>${x.status==='open'&&Number(x.quote_count)>0?`<br><a class="btn primary" style="display:inline-block;text-decoration:none;margin-top:7px" href="quotes.html?request=${x.id}">View Quotes</a>`:''}</div></div>`).join(''):'No requests yet.';bookings.innerHTML=d.bookings.length?d.bookings.map(x=>`<div class="row"><div><b>${esc(x.business_name)}</b><div class="muted">${esc(x.title)} · ${esc(x.status||'confirmed')}</div></div><div style="text-align:right"><b>${money(x.amount)}</b><div class="muted">${x.scheduled_at?new Date(x.scheduled_at).toLocaleString():''}</div>${x.status==='completed'&&!x.review_id?`<br><button class="btn primary" style="margin-top:7px" onclick="reviewBooking(${x.id})">Rate Provider</button>`:x.review_id?`<br><span class="muted">⭐ ${x.review_rating}/5 reviewed</span>`:''}</div></div>`).join(''):'No bookings yet.'}catch(e){alert(e.message)}}load()async function reviewBooking(id){const rating=prompt('Rate this provider from 1 to 5 stars:');if(rating===null)return;const r=Number(rating);if(!Number.isInteger(r)||r<1||r>5){alert('Please enter a whole number from 1 to 5.');return}const comment=prompt('Optional comment:')||'';try{await api('/bookings/'+id+'/review',{method:'POST',body:JSON.stringify({rating:r,comment})});alert('Thank you. Your review has been submitted.');load()}catch(e){alert(e.message)}}load()</script></body></html>
