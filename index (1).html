<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Marketplace — Search</title><style>
:root{--ink:#10221b;--muted:#66756f;--brand:#16845a;--soft:#eef8f3;--line:#e4ebe7;--bg:#f7faf8;--card:#fff;--shadow:0 10px 30px rgba(16,34,27,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.container{width:min(1160px,92%);margin:auto}nav{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:10}.nav{display:flex;align-items:center;justify-content:space-between}.logo{font-size:20px;font-weight:900}.logo span{color:var(--brand)}.links{display:flex;gap:22px;align-items:center;font-size:14px}.links a{text-decoration:none;color:#42514b}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:800;cursor:pointer}.primary{background:var(--brand);color:#fff}.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.top{padding:34px 0 22px}.crumb{font-size:13px;color:var(--muted);margin-bottom:18px}.searchbar{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:8px;display:flex;gap:8px}.searchbar input{border:0;outline:0;flex:1;padding:13px;font-size:15px;min-width:0}.loc{display:flex;align-items:center;gap:7px;padding:0 12px;border-left:1px solid var(--line);color:var(--muted);font-size:13px}.summary{padding:26px 0 12px;display:flex;justify-content:space-between;align-items:end;gap:15px}.summary h1{font-size:30px;margin:0 0 5px;letter-spacing:-1px}.summary p{margin:0;color:var(--muted)}.layout{display:grid;grid-template-columns:245px 1fr;gap:24px;padding:22px 0 70px}.filters,.result{background:#fff;border:1px solid var(--line);border-radius:20px}.filters{padding:20px;height:max-content;position:sticky;top:92px}.filters h3{margin:0 0 18px}.filter{padding:18px 0;border-top:1px solid var(--line)}.filter:first-of-type{border-top:0;padding-top:0}.filter label{display:flex;gap:9px;margin:11px 0;font-size:14px;color:#45544e}.filter input{accent-color:var(--brand)}.select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.results{display:flex;flex-direction:column;gap:12px}.result{padding:20px;display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:start}.avatar{width:64px;height:64px;border-radius:17px;background:#e2f3ea;display:grid;place-items:center;font-size:30px}.rmain h2{font-size:18px;margin:0 0 4px}.meta{font-size:13px;color:var(--muted)}.badges{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.badge{display:inline-block;background:#e8f7ef;color:#14704d;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:850}.rating{font-size:13px}.price{font-weight:900;margin-top:8px}.actions{display:flex;flex-direction:column;gap:8px;min-width:115px}.actions button{width:100%}.mobile{display:none}@media(max-width:800px){.links{display:none}.mobile{display:block}.layout{grid-template-columns:1fr}.filters{position:static}.result{grid-template-columns:52px 1fr}.avatar{width:52px;height:52px;font-size:24px}.actions{grid-column:2;display:flex;flex-direction:row}.summary{align-items:start;flex-direction:column}.loc{display:none}}@media(max-width:520px){.searchbar{flex-direction:column}.searchbar button{width:100%}.result{grid-template-columns:1fr}.rmain,.actions{grid-column:1}.actions{flex-direction:row}.actions .btn{flex:1}.summary h1{font-size:25px}}
</style></head><body>
<nav><div class="container nav"><a class="logo" href="index.html">Project<span>Marketplace</span></a><div class="links"><a href="#">Find Services</a><a href="#">How It Works</a><a href="#">Become a Provider</a><button class="btn outline">Login</button><button class="btn primary">Get Started</button></div><button class="btn outline mobile">Menu</button></div></nav>
<main class="container"><section class="top"><div class="crumb">Home / Find Services</div><form class="searchbar" onsubmit="runSearch(event)"><input id="q" value="fridge repair" placeholder="Describe a service or problem"><div class="loc">📍 Abuja</div><button class="btn primary">Search</button></form><div class="summary"><div><h1 id="title">Fridge repair in Abuja</h1><p>18 professionals found · ranked by relevance, quality and availability</p></div><select class="select" style="width:180px"><option>Recommended</option><option>Nearest</option><option>Top rated</option><option>Lowest price</option></select></div></section>
<section class="layout"><aside class="filters"><h3>Filters</h3><div class="filter"><b>Distance</b><label><input type="radio" name="d" checked> Within 5 km</label><label><input type="radio" name="d"> Within 10 km</label><label><input type="radio" name="d"> Any distance</label></div><div class="filter"><b>Availability</b><label><input type="checkbox"> Available now</label><label><input type="checkbox"> Available today</label></div><div class="filter"><b>Trust</b><label><input type="checkbox"> Verified only</label></div><div class="filter"><b>Rating</b><label><input type="checkbox"> 4.5+ stars</label><label><input type="checkbox"> 4+ stars</label></div><button class="btn outline" style="width:100%;margin-top:8px" onclick="resetFilters()">Clear filters</button></aside><div class="results" id="results"></div></section></main>
<script>
const providers=[['❄️','ABC Cooling Services','2.1 km away','4.9','128','₦5,000','Refrigerator & AC repair','Available today'],['❄️','Prime Cooling Solutions','3.4 km away','4.8','96','₦4,500','Fridge, freezer & AC specialist','Available today'],['🔧','Reliable Home Repairs','5.1 km away','4.7','73','₦6,000','Domestic appliance repairs','Available tomorrow'],['❄️','Capital ColdTech','6.8 km away','4.9','51','₦7,000','Commercial & domestic cooling','Available today']];
function render(){document.getElementById('results').innerHTML=providers.map((p,i)=>`<article class="result"><div class="avatar">${p[0]}</div><div class="rmain"><h2>${p[1]}</h2><div class="meta">📍 ${p[2]} · ${p[6]}</div><div class="badges"><span class="badge">✓ Verified</span><span class="badge">${p[7]}</span></div><div class="rating">⭐ <b>${p[3]}</b> · ${p[4]} reviews</div><div class="price">From ${p[5]}</div></div><div class="actions"><button class="btn outline" onclick="profile(${i})">View Profile</button><button class="btn primary" onclick="request(${i})">Request</button></div></article>`).join('')}
function runSearch(e){e.preventDefault();const q=document.getElementById('q').value.trim()||'service';document.getElementById('title').textContent=q.charAt(0).toUpperCase()+q.slice(1)+' in Abuja';render()}
function profile(i){window.location.href='provider.html'}
function request(i){alert(`Service request started for ${providers[i][1]}.\nNext build: Post a Problem → Quote → Booking.`)}
function resetFilters(){document.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=false);document.querySelector('input[name=d]').checked=true}
render();
</script></body></html>
