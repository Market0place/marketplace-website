<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Provider Dashboard</title><style>body{margin:0;font-family:Inter,system-ui;background:#f7faf8;color:#10221b}.wrap{width:min(1100px,92%);margin:30px auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:15px}.card{background:#fff;border:1px solid #e4ebe7;border-radius:18px;padding:20px;margin:16px 0}.btn{padding:10px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#16845a;color:#fff}.muted{color:#66756f}.row{display:flex;justify-content:space-between;gap:18px;align-items:center;border-top:1px solid #e4ebe7;padding:16px 0}.row:first-child{border-top:0}.quote{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.quote input{padding:9px;border:1px solid #e4ebe7;border-radius:8px;width:120px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.status{font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px;background:#eef3f0}.danger{background:#9d302b;color:#fff}.secondary{background:#eef3f0;color:#10221b}.small{font-size:13px}@media(max-width:700px){.row{align-items:flex-start;flex-direction:column}.actions,.quote{justify-content:flex-start;width:100%}}</style></head><body><div class="wrap"><div class="bar"><div><h1>Provider Dashboard</h1><p id="welcome" class="muted"></p></div><div class="actions"><button class="btn secondary" onclick="location.href='messages.html'">Messages</button><button class="btn secondary" onclick="location.href='notifications.html'">Notifications</button><button class="btn" onclick="logout()">Logout</button></div></div><div class="card"><h2>Business</h2><div id="business">Loading...</div></div><div class="card"><h2>Service Requests</h2><div id="requests">Loading...</div></div><div class="card"><h2>Bookings</h2><div id="bookings">Loading...</div></div></div><script src="dashboard.js"></script><script>function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}async function sendQuote(id){try{let amount=document.getElementById('amt'+id).value,msg=document.getElementById('msg'+id).value;await api('/quotes',{method:'POST',body:JSON.stringify({request_id:id,amount:Number(amount),message:msg})});load()}catch(e){alert(e.message)}}async function messageCustomer(providerId,customerId,requestId){try{const c=await api('/conversations',{method:'POST',body:JSON.stringify({provider_id:providerId,customer_id:customerId,request_id:requestId})});location.href='messages.html?conversation='+c.id}catch(e){alert(e.message)}}async function updateStatus(id,status){try{await api('/bookings/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});load()}catch(e){alert(e.message)}}async function load(){try{let d=await api('/provider/dashboard');welcome.textContent='Welcome, '+d.user.name;business.innerHTML='<b>'+esc(d.business.name)+'</b><div class="muted">'+esc(d.business.category||'Category not set')+' · '+esc(d.business.city||'')+' · ⭐ '+Number(d.business.rating||0).toFixed(1)+' ('+Number(d.business.review_count||0)+' reviews)</div>';requests.innerHTML=d.requests.length?d.requests.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.description)}</div><div class="small muted">${esc(x.city||'')} · ${esc(x.urgency||'flexible')}</div></div>${x.quote_id?`<div><span class="status">Quote sent: ${money(x.quote_amount)}</span><div class="actions" style="margin-top:8px"><button class="btn secondary" onclick="messageCustomer(${d.user.id},${x.customer_id||''},${x.id})">Message</button></div></div>`:`<div class="quote"><input id="amt${x.id}" type="number" min="1" placeholder="Amount"><input id="msg${x.id}" placeholder="Message"><button class="btn primary" onclick="sendQuote(${x.id})">Send Quote</button></div>`}</div>`).join(''):'No open requests yet.';bookings.innerHTML=d.bookings.length?d.bookings.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.status)}</div><div class="small muted">${x.scheduled_at?'Scheduled: '+esc(x.scheduled_at):'Schedule not set'}</div></div><div class="actions"><b>${money(x.amount)}</b><button class="btn secondary" onclick="messageCustomer(${d.user.id},${x.customer_id},${x.request_id})">Message Customer</button>${x.status==='confirmed'?'<button class="btn primary" onclick="updateStatus('+x.id+','in_progress')">Start Job</button>':''}${x.status==='in_progress'?'<button class="btn primary" onclick="updateStatus('+x.id+','completed')">Mark Completed</button>':''}${!['completed','cancelled'].includes(x.status)?'<button class="btn danger" onclick="updateStatus('+x.id+','cancelled')">Cancel</button>':''}</div></div>`).join(''):'No bookings yet.'}catch(e){alert(e.message)}}load()</script></body></html>
