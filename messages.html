<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages — Project Marketplace</title><style>
body{margin:0;font-family:Inter,system-ui;background:#f7faf8;color:#10221b}.wrap{width:min(1050px,94%);margin:28px auto}.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}.card{background:#fff;border:1px solid #e4ebe7;border-radius:18px;padding:18px}.list{display:grid;gap:8px}.conv{padding:12px;border:1px solid #e4ebe7;border-radius:12px;cursor:pointer}.conv.active{border-color:#16845a}.msgs{height:430px;overflow:auto;border:1px solid #e4ebe7;border-radius:12px;padding:14px}.msg{margin:9px 0;padding:10px 12px;border-radius:12px;background:#eef3f0;max-width:75%}.mine{margin-left:auto;background:#e3f4eb}.send{display:flex;gap:8px;margin-top:10px}.send input{flex:1;padding:12px;border:1px solid #e4ebe7;border-radius:10px}.btn{padding:11px 15px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#16845a;color:white}.muted{color:#66756f}@media(max-width:750px){.grid{grid-template-columns:1fr}.msgs{height:350px}}
</style></head><body><div class="wrap"><h1>Messages</h1><p class="muted">Chat with customers and service providers.</p>
<div class="grid"><div class="card"><h3>Conversations</h3><div id="convs" class="list">Loading...</div></div>
<div class="card"><h3 id="title">Select a conversation</h3><div id="msgs" class="msgs"></div><div class="send"><input id="body" placeholder="Write a message..." disabled><button class="btn primary" id="send" disabled>Send</button></div></div></div>
</div><script>
let selected=null;
async function api(p,o={}){const t=localStorage.getItem('pm_token');if(!t){location.href='auth.html';return}o.headers={...(o.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+t};const r=await fetch(p,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){const rows=await api('/api/conversations');convs.innerHTML=rows.length?rows.map(c=>`<div class="conv ${selected==c.id?'active':''}" onclick="openConv(${c.id},'${String(c.other_name).replaceAll("'","&#39;")}')"><b>${c.other_name}</b><div class="muted">${c.last_message||'No messages yet'} ${c.unread_count?`· ${c.unread_count} new`:''}</div></div>`).join(''):'No conversations yet.'}
async function openConv(id,name){selected=id;title.textContent=name;body.disabled=false;send.disabled=false;const rows=await api('/api/conversations/'+id+'/messages');msgs.innerHTML=rows.map(m=>`<div class="msg ${m.sender_id==JSON.parse(localStorage.getItem('pm_user')).id?'mine':''}"><b>${m.sender_name}</b><br>${escapeHtml(m.body)}</div>`).join('');msgs.scrollTop=msgs.scrollHeight;load()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}
send.onclick=async()=>{if(!selected||!body.value.trim())return;await api('/api/conversations/'+selected+'/messages',{method:'POST',body:JSON.stringify({body:body.value})});body.value='';openConv(selected,title.textContent)}
body.addEventListener('keydown',e=>{if(e.key==='Enter')send.click()});load();
</script></body></html>
