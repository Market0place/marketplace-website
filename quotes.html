<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotes — Project Marketplace</title><style>
:root{--ink:#10221b;--muted:#66756f;--brand:#16845a;--soft:#eef8f3;--line:#e4ebe7;--bg:#f7faf8;--card:#fff;--shadow:0 10px 30px rgba(16,34,27,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.container{width:min(1000px,92%);margin:auto}nav{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-size:20px;font-weight:900;text-decoration:none;color:var(--ink)}.logo span{color:var(--brand)}.back{color:var(--muted);text-decoration:none;font-size:14px}.hero{padding:34px 0 18px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:var(--muted)}.problem{background:var(--soft);border:1px solid #d7eee2;border-radius:18px;padding:18px;margin:20px 0}.problem b{display:block;margin-bottom:6px}.meta{color:var(--muted);font-size:13px}.quotes{display:flex;flex-direction:column;gap:14px;padding-bottom:70px}.quote{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;grid-template-columns:60px 1fr auto;gap:16px;box-shadow:var(--shadow)}.avatar{width:60px;height:60px;border-radius:16px;background:#e2f3ea;display:grid;place-items:center;font-size:28px}.name{font-size:18px;font-weight:900}.small{font-size:13px;color:var(--muted);margin-top:4px}.badges{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.badge{background:#e8f7ef;color:#14704d;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:850}.message{margin:12px 0;color:#45544e;line-height:1.5}.price{font-size:21px;font-weight:900;margin-bottom:5px}.actions{display:flex;flex-direction:column;gap:8px;min-width:125px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:850;cursor:pointer}.primary{background:var(--brand);color:#fff}.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:650px){.quote{grid-template-columns:52px 1fr}.avatar{width:52px;height:52px}.actions{grid-column:1/-1;display:flex;flex-direction:row}.actions .btn{flex:1}.hero h1{font-size:26px}}
</style></head><body><nav><div class="container nav"><a class="logo" href="index.html">Project<span>Marketplace</span></a><a class="back" href="index.html">← Back to home</a></div></nav><main class="container"><section class="hero"><h1>Professionals who can help</h1><p>Compare quotes and choose the provider that's right for you.</p><div class="problem"><b id="problemTitle">Your request</b><span class="meta" id="problemMeta">Abuja · Today</span></div></section><section class="quotes" id="quotes"></section></main><script>
async function api(path,opts={}){const token=localStorage.getItem('pm_token');if(!token){location.href='auth.html';throw new Error('Please login first.')}opts.headers={...(opts.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};const r=await fetch(path,opts);const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function load(){try{const d=JSON.parse(localStorage.getItem('pm_problem')||'{}');document.getElementById('problemTitle').textContent=d.problem||'Your service request';document.getElementById('problemMeta').textContent=(d.location||'Abuja')+' · '+(d.when||'Flexible')+' · '+(d.category||'General service');const id=new URLSearchParams(location.search).get('request')||localStorage.getItem('pm_request_id');if(!id){document.getElementById('quotes').innerHTML='<div class="empty">No request found. <a href="post-problem.html">Post a problem</a></div>';return}localStorage.setItem('pm_request_id',id);const qs=await api('/api/requests/'+id+'/quotes');document.getElementById('quotes').innerHTML=qs.length?qs.map(q=>`<article class="quote"><div class="avatar">🛠️</div><div><div class="name">${esc(q.business_name)}</div><div class="small">⭐ <b>${Number(q.rating||0).toFixed(1)}</b> · ${q.verified?'Verified provider':'Provider'} · 📍 ${esc(q.city||'')}</div><div class="badges"><span class="badge">${q.verified?'✓ Verified':'Provider'}</span></div><div class="message">${esc(q.message||'Quote for your request.')}</div><div class="price">₦${Number(q.amount).toLocaleString()}</div><div class="small">Quoted service price</div></div><div class="actions"><button class="btn primary" onclick="accept(${q.id},${q.request_id},${q.amount},'${esc(q.business_name)}')">Accept Quote</button></div></article>`).join(''):'<div class="empty">No quotes yet. Providers will appear here when they respond to your request.</div>'}catch(e){document.getElementById('quotes').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function accept(quoteId,requestId,amount,business){localStorage.setItem('pm_quote',JSON.stringify({id:quoteId,request_id:requestId,amount,business_name:business}));location.href='booking.html'}
load();
</script></body></html>
