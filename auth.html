<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Marketplace — Login</title><style>body{margin:0;font-family:Inter,system-ui;background:#f7faf8;color:#10221b}.wrap{width:min(500px,92%);margin:60px auto}.card{background:#fff;border:1px solid #e4ebe7;border-radius:22px;padding:28px;box-shadow:0 12px 35px #10221b12}h1{margin:0 0 7px}.muted{color:#66756f}.tabs{display:flex;gap:8px;margin:22px 0}button{font:inherit;border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.tab{background:#fff;border:1px solid #e4ebe7}.active,.primary{background:#16845a;color:#fff}form{display:grid;gap:12px}label{font-size:13px;font-weight:800}input,select{padding:13px;border:1px solid #e4ebe7;border-radius:11px;font:inherit}.notice{padding:12px;border-radius:10px;background:#eef8f3;margin-bottom:15px;display:none}</style></head><body><div class="wrap"><div class="card"><h1>Project Marketplace</h1><p class="muted">Join the marketplace as a customer or service provider.</p><div id="notice" class="notice"></div><div class="tabs"><button id="lt" class="tab active" onclick="show('login')">Login</button><button id="rt" class="tab" onclick="show('register')">Register</button></div><section id="login"><form onsubmit="login(event)"><label>Email or phone<input id="identifier" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" required></label><button class="primary">Login</button></form></section><section id="register" style="display:none"><form onsubmit="register(event)"><label>Full name<input id="name" required></label><label>Email<input id="email" type="email" placeholder="you@example.com"></label><label>Phone<input id="phone" placeholder="080..."></label><label>Password<input id="pass" type="password" minlength="8" required placeholder="At least 8 characters"></label><label>Account type<select id="role"><option value="customer">Customer — I need a service</option><option value="provider">Provider — I offer services</option></select></label><button class="primary">Create Account</button></form></section></div></div><script>async function api(p,o={}){o.headers={'Content-Type':'application/json',...(o.headers||{})};let r=await fetch('/api'+p,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function msg(s,ok=true){let n=document.getElementById('notice');n.textContent=s;n.style.display='block';n.style.background=ok?'#eef8f3':'#fff0f0'}function show(x){login.style.display=x==='login'?'block':'none';register.style.display=x==='register'?'block':'none';lt.classList.toggle('active',x==='login');rt.classList.toggle('active',x==='register');notice.style.display='none'}async function login(e){e.preventDefault();try{let d=await api('/auth/login',{method:'POST',body:JSON.stringify({identifier:identifier.value,password:password.value})});localStorage.pm_token=d.token;localStorage.pm_user=JSON.stringify(d.user);location.href=d.user.role==='provider'?'provider-dashboard.html':'customer-dashboard.html'}catch(e){msg(e.message,false)}}async function register(e){e.preventDefault();try{let d=await api('/auth/register',{method:'POST',body:JSON.stringify({name:name.value,email:email.value,phone:phone.value,password:pass.value,role:role.value})});localStorage.pm_token=d.token;localStorage.pm_user=JSON.stringify(d.user);location.href=d.user.role==='provider'?'provider-dashboard.html':'customer-dashboard.html'}catch(e){msg(e.message,false)}}</script></body></html>
