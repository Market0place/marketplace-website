<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#18202a}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:20px 0}.card{background:white;padding:18px;border-radius:14px;box-shadow:0 2px 10px #0001}.num{font-size:28px;font-weight:700}.muted{color:#667085;font-size:13px}section{background:#fff;border-radius:14px;padding:18px;margin:18px 0;overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:14px}button{border:0;border-radius:8px;padding:8px 12px;cursor:pointer;background:#111827;color:#fff}.verify{background:#0b7a4b}.unverify{background:#9a3412}.error{color:#b42318}.login{max-width:420px;margin:80px auto;background:#fff;padding:24px;border-radius:16px}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #d0d5dd;border-radius:8px}</style></head><body><div id="app"></div><script>
const token=localStorage.getItem('pm_token');const app=document.getElementById('app');
if(!token){app.innerHTML='<div class="login"><h2>Admin Login</h2><p class="muted">Use an admin account created for this deployment.</p><input id="id" placeholder="Email or phone"><input id="pw" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="err" class="error"></p></div>'}
async function login(){const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:id.value,password:pw.value})});const d=await r.json();if(!r.ok)return err.textContent=d.error||'Login failed';if(d.user.role!=='admin')return err.textContent='This account is not an admin';localStorage.setItem('pm_token',d.token);location.reload()}
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){try{const [s,u,b,bs,p,rv]=await Promise.all([api('/api/admin/stats'),api('/api/admin/users'),api('/api/admin/businesses'),api('/api/admin/bookings'),api('/api/admin/payments'),api('/api/admin/reviews')]);app.innerHTML=`<div class="wrap"><div class="top"><div><h1>Marketplace Admin</h1><div class="muted">Operations, verification, bookings and payments</div></div><button onclick="localStorage.removeItem('pm_token');location.reload()">Logout</button></div><div class="cards">${[['Users',s.users],['Customers',s.customers],['Providers',s.providers],['Businesses',s.businesses],['Verified',s.verified_businesses],['Open Requests',s.open_requests],['Bookings',s.bookings],['Completed',s.completed_bookings],['Paid',s.payments],['Revenue', '₦'+Number(s.revenue).toLocaleString()],['Reviews',s.reviews]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('')}</div><section><h2>Businesses & Verification</h2><table><thead><tr><th>Business</th><th>Owner</th><th>City</th><th>Rating</th><th>Status</th><th>Action</th></tr></thead><tbody>${b.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.owner_name)}</td><td>${esc(x.city||'')}</td><td>${x.rating} (${x.review_count})</td><td>${x.verified?'Verified':'Pending'}</td><td><button class="${x.verified?'unverify':'verify'}" onclick="verify(${x.id},${x.verified?0:1})">${x.verified?'Remove':'Verify'}</button></td></tr>`).join('')}</tbody></table></section><section><h2>Recent Bookings</h2><table><thead><tr><th>Job</th><th>Customer</th><th>Provider</th><th>Amount</th><th>Booking</th><th>Payment</th></tr></thead><tbody>${bs.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.customer_name)}</td><td>${esc(x.business_name)}</td><td>₦${Number(x.amount).toLocaleString()}</td><td>${x.status}</td><td>${x.payment_status||'—'}</td></tr>`).join('')}</tbody></table></section><section><h2>Payments</h2><table><thead><tr><th>Reference</th><th>Customer</th><th>Provider</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody>${p.map(x=>`<tr><td>${esc(x.reference)}</td><td>${esc(x.customer_name)}</td><td>${esc(x.business_name)}</td><td>₦${Number(x.amount).toLocaleString()}</td><td>${x.status}</td><td>${x.created_at}</td></tr>`).join('')}</tbody></table></section><section><h2>Recent Reviews</h2><table><thead><tr><th>Provider</th><th>Customer</th><th>Rating</th><th>Comment</th></tr></thead><tbody>${rv.map(x=>`<tr><td>${esc(x.business_name)}</td><td>${esc(x.customer_name)}</td><td>${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</td><td>${esc(x.comment||'')}</td></tr>`).join('')}</tbody></table></section></div>`}catch(e){app.innerHTML='<div class="login"><h2>Admin error</h2><p class="error">'+esc(e.message)+'</p><button onclick="localStorage.removeItem(\'pm_token\');location.reload()">Back to login</button></div>'}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function verify(id,v){try{await api('/api/admin/businesses/'+id+'/verify',{method:'PATCH',body:JSON.stringify({verified:v})});load()}catch(e){alert(e.message)}}if(token)load();
</script></body></html>
