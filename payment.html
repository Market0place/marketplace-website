<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment — Project Marketplace</title><style>
:root{--ink:#10221b;--muted:#66756f;--brand:#16845a;--soft:#eef8f3;--line:#e4ebe7;--bg:#f7faf8;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--ink)}.wrap{width:min(720px,92%);margin:40px auto}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(16,34,27,.07)}h1{margin-top:0}.muted{color:var(--muted)}.price{font-size:34px;font-weight:900;margin:18px 0}.row{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line)}button,a{font:inherit}.pay{width:100%;padding:15px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:900;cursor:pointer;margin-top:18px}.pay:disabled{opacity:.6}.demo{background:var(--soft);padding:14px;border-radius:12px;margin:18px 0}.success{display:none;text-align:center}.success .icon{font-size:48px}.error{color:#a33;margin-top:12px}</style></head><body><main class="wrap"><section class="card" id="box"><h1>Complete your payment</h1><p class="muted">Secure checkout for your accepted service quote.</p><div class="row"><span>Service</span><b id="service">—</b></div><div class="row"><span>Provider</span><b id="provider">—</b></div><div class="price" id="amount">₦0</div><div class="demo"><b>Secure Paystack checkout</b><br><span class="muted">You will be redirected to Paystack to complete payment securely. Your card or bank details are never stored by this marketplace.</span></div><button class="pay" id="pay" onclick="payNow()">Pay now</button><div class="error" id="error"></div></section><section class="card success" id="success"><div class="icon">✅</div><h2>Payment successful</h2><p class="muted" id="successText"></p><button class="pay" onclick="location.href='customer-dashboard.html'">Go to Dashboard</button></section></main><script>
async function api(path,opts={}){const t=localStorage.getItem('pm_token');if(!t){location.href='auth.html';throw new Error('Please login first')}opts.headers={...(opts.headers||{}),Authorization:'Bearer '+t,'Content-Type':'application/json'};const r=await fetch(path,opts);const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}
const id=new URLSearchParams(location.search).get('booking');if(!id)location.href='customer-dashboard.html';
async function load(){try{const p=await api('/bookings/'+id+'/payment');service.textContent=p.title;amount.textContent='₦'+Number(p.amount).toLocaleString();if(p.status==='paid'){box.style.display='none';success.style.display='block';successText.textContent='Payment reference: '+p.reference}else{const b=await api('/customer/dashboard');const x=b.bookings.find(v=>String(v.id)===String(id));if(x)provider.textContent=x.business_name;const ref=new URLSearchParams(location.search).get('reference');if(ref){error.textContent='Verifying your Paystack payment…';await verify(ref)}}}catch(e){error.textContent=e.message;pay.disabled=true}}async function payNow(){pay.disabled=true;error.textContent='Opening secure Paystack checkout…';try{const d=await api('/bookings/'+id+'/pay',{method:'POST'});if(d.authorization_url)location.href=d.authorization_url;else throw new Error('Paystack checkout was not created')}catch(e){error.textContent=e.message;pay.disabled=false}}async function verify(reference){try{const d=await api('/api/bookings/'+id+'/paystack/verify',{method:'POST',body:JSON.stringify({reference})});box.style.display='none';success.style.display='block';successText.textContent='Payment reference: '+d.reference+'. Your booking is now confirmed.'}catch(e){error.textContent=e.message;pay.disabled=false}}load();
</script></body></html>
